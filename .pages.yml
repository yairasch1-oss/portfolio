# Dashboard settings (Pages CMS — https://pagescms.org)
media:
  input: media
  output: /media

content:
  - name: projects
    label: פרויקטים
    type: collection
    path: content/projects
    format: json
    filename: "{primary}.json"
    actions:
      - name: duplicate
        label: "שכפול פרויקט"
        workflow: duplicate.yml
        scope: entry
        ref: current
        confirm:
          title: "שכפול פרויקט"
          message: "נוצר עותק עם כל הפרטים והתמונות. אחרי דקה הוא יופיע ברשימה (אם לא, רעננו את הדף)."
          button: "שכפול"
        fields:
          - { name: title_he, label: "שם חדש (עברית)", type: text, required: true }
          - { name: title_en, label: "New name (English)", type: text }
          - { name: hide, label: "להסתיר באתר עד שאסיים לערוך", type: checkbox, default: true }
    fields:
      - { name: title_en, label: "Title (English)", type: string, required: true }
      - { name: title_he, label: "כותרת (עברית)", type: string }
      - { name: order, label: "סדר בדף הבית (1 = ראשון)", type: number }
      - { name: draft, label: "טיוטה (לא מוצג באתר)", type: boolean }
      - { name: cover, label: "תמונה ראשית / כריכה", type: image }
      - { name: images, label: "תמונות הפרויקט (לפי הסדר)", type: image, list: true }
      - { name: meta_en, label: "Subtitle (English) — course, year", type: string }
      - { name: meta_he, label: "שורת פרטים (עברית) — קורס, שנה", type: string }
      - { name: text_en, label: "Text (English) — empty line = new paragraph", type: text }
      - { name: text_he, label: "טקסט (עברית) — שורה ריקה = פסקה חדשה", type: text }

  - name: site
    label: פרטי האתר, אודות וקשר
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name_en, label: "Name (English)", type: string }
      - { name: name_he, label: "שם (עברית)", type: string }
      - { name: intro_en, label: "Home intro (English) — leave empty to hide", type: text }
      - { name: intro_he, label: "פתיח בדף הבית (עברית) — ריק = מוסתר", type: text }
      - { name: about_title_en, label: "About page title (English)", type: string }
      - { name: about_title_he, label: "כותרת עמוד אודות (עברית)", type: string }
      - { name: about_text_en, label: "About text (English)", type: text }
      - { name: about_text_he, label: "פסקה בעמוד אודות (עברית)", type: text }
      - { name: portrait, label: "תמונת פרופיל", type: image }
      - { name: cv_pdf, label: "קורות חיים (PDF)", type: file }
      - name: cv
        label: שורות קורות חיים
        type: object
        list: true
        fields:
          - { name: years, label: "שנים", type: string }
          - { name: text_en, label: "English", type: string }
          - { name: text_he, label: "עברית", type: string }
      - { name: instagram, label: "קישור לאינסטגרם", type: string }
      - { name: email, label: "דוא״ל", type: string }
      - { name: phone_en, label: "Phone (English format)", type: string }
      - { name: phone_he, label: "טלפון (פורמט עברי)", type: string }
      - { name: address_en, label: "Business address (English)", type: string }
      - { name: address_he, label: "כתובת העסק (עברית)", type: string }
      - { name: contact_en, label: "Contact text (English)", type: text }
      - { name: contact_he, label: "טקסט צור קשר (עברית)", type: text }

  - name: shop
    label: חנות – מוצרים
    type: collection
    path: content/shop
    format: json
    filename: "{primary}.json"
    actions:
      - name: duplicate
        label: "שכפול מוצר"
        workflow: duplicate.yml
        scope: entry
        ref: current
        confirm:
          title: "שכפול מוצר"
          message: "נוצר עותק עם כל הפרטים והתמונות. אחרי דקה הוא יופיע ברשימה (אם לא, רעננו את הדף)."
          button: "שכפול"
        fields:
          - { name: title_he, label: "שם חדש (עברית)", type: text, required: true }
          - { name: title_en, label: "New name (English)", type: text }
          - { name: hide, label: "להסתיר באתר עד שאסיים לערוך", type: checkbox, default: true }
    fields:
      - { name: title_en, label: "Product name (English)", type: string, required: true }
      - { name: title_he, label: "שם המוצר (עברית)", type: string }
      - { name: order, label: "סדר בחנות (1 = ראשון)", type: number }
      - { name: draft, label: "טיוטה (לא מוצג באתר)", type: boolean }
      - { name: cover, label: "תמונה ראשית", type: image }
      - { name: images, label: "תמונות נוספות", type: image, list: true }
      - { name: text_en, label: "Description (English)", type: text }
      - { name: text_he, label: "תיאור (עברית)", type: text }
      - name: variants
        label: "גדלים ומחירים"
        type: object
        list: true
        fields:
          - { name: size_he, label: "גודל (עברית), למשל: פוסטר 35×70 ס״מ", type: string }
          - { name: size_en, label: "Size (English), e.g. Poster 35×70 cm", type: string }
          - { name: price, label: "מחיר (₪)", type: number }
          - { name: frame_price, label: "תוספת מסגרת (₪) – ריק = אין מסגרת לגודל הזה", type: number }

  - name: shop_settings
    label: חנות – הגדרות ותקנון
    type: file
    path: content/shop.json
    format: json
    fields:
      - { name: shipping_price, label: "מחיר משלוח (₪) – 0 = בלי אפשרות משלוח", type: number }
      - { name: pickup_he, label: "טקסט איסוף עצמי (עברית)", type: string }
      - { name: pickup_en, label: "Pickup text (English)", type: string }
      - { name: shipping_he, label: "טקסט משלוח (עברית)", type: string }
      - { name: shipping_en, label: "Delivery text (English)", type: string }
      - { name: intro_he, label: "פתיח לעמוד החנות (עברית)", type: text }
      - { name: intro_en, label: "Shop intro (English)", type: text }
      - { name: terms_he, label: "תקנון (עברית) – שורה שמתחילה ב-## היא כותרת", type: text }
      - { name: terms_en, label: "Terms (English) – a line starting with ## is a heading", type: text }
      - { name: checkout_live, label: "תשלום אונליין פעיל (להדליק רק אחרי אישור הסליקה)", type: boolean }
      - { name: currency, label: "סימן מטבע", type: string, hidden: true }
